[build]
  publish = "public"
  # Runs the pipeline in a full build VM (installs torch, deps, then generates
  # public/feed.xml + index.html + items.json). Triggered by the scheduled
  # function netlify/functions/daily-cron.mjs -> build hook.
  command = "bash scripts/netlify_build.sh"

[build.environment]
  PYTHON_VERSION = "3.11"

# Only the production build runs the (heavy) pipeline. Deploy Previews and
# branch deploys just publish the committed public/ as-is, so a push to a
# non-production branch does not reinstall torch / re-generate the feed.
[context.deploy-preview]
  command = "echo 'skipping pipeline in deploy preview'"

[context.branch-deploy]
  command = "echo 'skipping pipeline in branch deploy'"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
